name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/pawhub/package-lock.json
      - run: npm ci --prefix frontend/pawhub
      - run: npm run lint --prefix frontend/pawhub
      - run: npm test --prefix frontend/pawhub
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/pawhub/coverage/lcov.info
          flags: frontend			

  backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      
      - name: Run tests with Maven
        run: mvn clean test
        working-directory: backend/backend     
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/backend/target/site/jacoco/jacoco.xml
          flags: backend	