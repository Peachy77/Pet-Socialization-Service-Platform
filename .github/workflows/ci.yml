name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/pawhub/package-lock.json
      - run: npm ci --prefix frontend/pawhub
      - run: npm run lint --prefix frontend/pawhub
      - run: npm test --prefix frontend/pawhub
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/pawhub/coverage/lcov.info
          flags: frontend				